<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1430" media="(prefers-color-scheme: dark)">
<title>TaraTube stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff7aa2' d='M12 1.8l2.9 6.4 6.9.7-5.2 4.6 1.5 6.8L12 16.8l-6.1 3.5 1.5-6.8L2.2 8.9l6.9-.7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tt.css">
<style>
  .wrap { padding-bottom: 60px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .tile { margin: 0; padding: 14px; }
  .tile .v { font: 600 28px/1.05 var(--display); letter-spacing: -.02em; }
  .tile .v small { font-size: .55em; color: var(--muted); font-weight: 500; margin: 0 2px; }
  .tile .d { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .tile.pink .v { color: var(--blush-deep); }
  .tile.lilac .v { color: var(--lilac-deep); }
  .tile.wide { grid-column: span 2; }
  .vs { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

  h2.sec { font: 600 21px/1.1 var(--display); margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
  h2.sec::before { content: "✦"; color: var(--sun); font-size: 16px; }

  .records { list-style: none; margin: 0; padding: 0; }
  .records li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .records li:first-child { border-top: 0; padding-top: 2px; }
  .records .ic { width: 40px; height: 40px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 19px; background: var(--surface-2); }
  .records .ic.pink { background: var(--blush-soft); }
  .records .ic.lilac { background: var(--lilac-soft); }
  .records .ic.sun { background: color-mix(in srgb, var(--sun) 35%, var(--surface)); }
  .records .k { flex: 1; font-weight: 700; }
  .records .k small { display: block; font-weight: 600; color: var(--muted); font-size: 12.5px; }
  .records .val { font: 600 19px/1 var(--display); text-align: right; white-space: nowrap; }

  .split { display: flex; height: 40px; border-radius: 14px; overflow: hidden; gap: 2px; margin: 4px 0 8px; }
  .split div { display: flex; align-items: center; justify-content: center; font: 600 15px/1 var(--display); color: var(--on-accent); min-width: 44px; }
  .split .l { background: var(--blush); }
  .split .r { background: var(--lilac); }
  .split-key { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 700; }

  .chart { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 8px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; cursor: pointer; border-radius: 8px; }
  .chart .bar { width: 100%; max-width: 30px; background: var(--blush); border-radius: 6px 6px 2px 2px; min-height: 2px; transition: opacity .15s; }
  .chart.lilac .bar { background: var(--lilac); }
  .chart .bar.zero { background: var(--line); }
  .chart .col.dim .bar { opacity: .4; }
  .chart .x { font-size: 10.5px; color: var(--muted); font-weight: 700; white-space: nowrap; height: 13px; }
  .chart-read { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 10px; min-height: 20px; }
  .chart-read b { color: var(--ink); }
  .base { border-top: 1px solid var(--line); margin-top: -19px; margin-bottom: 19px; }

  .log-day { font: 700 12px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 4px 8px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li button {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    border: 0; background: var(--surface); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line);
  }
  .log .tm { font: 600 18px/1 var(--display); min-width: 78px; }
  .log .mid { flex: 1; font-size: 14px; font-weight: 700; }
  .log .mid small { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; margin-top: 2px; }
  .log .gap { font-size: 12.5px; color: var(--muted); font-weight: 700; text-align: right; }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); font-weight: 700; }
  .empty .star { width: 48px; height: 48px; color: var(--sun); }

  /* Edit sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(40, 15, 45, .35); z-index: 30; opacity: 0; transition: .2s; pointer-events: none; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface);
    border-radius: 28px 28px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto; transform: translateY(105%); transition: transform .25s;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .15); visibility: hidden;
  }
  .sheet.open { transform: none; visibility: visible; }
  .sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { font: 600 22px/1 var(--display); margin: 0 0 14px; }
  .sheet .f { margin-bottom: 14px; }
  .sheet input[type=datetime-local], .sheet input[type=number], .sheet input[type=text] {
    width: 100%; border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 17px;
  }
  .sheet .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet .seg2 button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 48px; font: 600 17px/1 var(--display); }
  .sheet .seg2 button[aria-pressed="true"] { border-color: var(--blush); background: var(--blush-soft); }
  .sheet .actions { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 6px; }
  .sheet .del { border: 0; background: var(--surface-2); color: var(--blush-deep); border-radius: 18px; padding: 0 18px; font-weight: 800; min-height: 56px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">
      <span id="brandStar"></span>
      <div><span class="h1" style="font:600 28px/1 var(--display)">Tara<b style="color:var(--blush);font-weight:600">Tube</b></span><small>stats &amp; records</small></div>
    </a>
    <a class="pill-btn" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</a>
  </header>

  <p class="err-line" id="loadErr" hidden style="color:var(--blush-deep);font-weight:700;text-align:center"></p>
  <div id="main"><div class="empty">Loading…</div></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<form class="sheet" id="sheet" aria-hidden="true">
  <div class="grab"></div>
  <h3>Edit entry</h3>
  <div class="f"><p class="label">When</p><input type="datetime-local" name="at" required></div>
  <div class="f"><p class="label">Tube</p><div class="seg2" data-field="kind"><button type="button" data-v="new">New tube</button><button type="button" data-v="same">Same tube</button></div></div>
  <div class="f"><p class="label">Side</p><div class="seg2" data-field="side"><button type="button" data-v="L">Left</button><button type="button" data-v="R">Right</button></div></div>
  <div class="f" style="display:grid;grid-template-columns:1fr 1.6fr;gap:10px">
    <div><p class="label">Length (cm)</p><input type="number" name="len" step="0.5" min="0" max="100" inputmode="decimal" placeholder="—"></div>
    <div><p class="label">Note</p><input type="text" name="note" maxlength="500" placeholder="optional"></div>
  </div>
  <div class="actions"><button type="button" class="del" id="delBtn">Delete</button><button class="big-btn" type="submit">Save</button></div>
</form>

<script src="../tt.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  TT.sky();
  $('brandStar').outerHTML = TT.STAR;
  let evs = TT.cached();
  const esc = TT.esc;
  const durHTML = ms => TT.durParts(ms).map(([n, u]) => `${n}<small>${u}</small>`).join('');

  function render() {
    if (!evs.length) {
      $('main').innerHTML = `<div class="empty">${TT.STAR}<p>No tube logs yet.<br>Log the first one and the stats show up here.</p><a class="pill-btn" href="../">Log one</a></div>`;
      return;
    }
    const s = TT.stats(evs);
    const now = Date.now();
    const trend = s.prev7 ? (s.last7 < s.prev7 ? `down from ${s.prev7}` : s.last7 > s.prev7 ? `up from ${s.prev7}` : 'same as the week before') : 'this week';
    let h = `<section class="tiles">
      <div class="card tile lilac"><p class="label">Since last drop</p><div class="v">${durHTML(s.sinceLast)}</div>
        <div class="d">${s.longestGap ? (s.onRecord ? '✦ new record!' : `record: ${TT.dur(s.longestGap.ms, { short: true })}`) : '&nbsp;'}</div></div>
      <div class="card tile pink"><p class="label">This tube's age</p><div class="v">${s.lastNew ? durHTML(s.sinceNew) : '—'}</div>
        <div class="d">${s.tubes.length ? `${s.tubes[s.tubes.length - 1].redrops} re-drop${s.tubes[s.tubes.length - 1].redrops === 1 ? '' : 's'} so far` : '&nbsp;'}</div></div>
      <div class="card tile"><p class="label">Drops, last 7 days</p><div class="v">${s.last7}</div><div class="d">${trend}</div></div>
      <div class="card tile"><p class="label">All time</p><div class="v">${s.total}</div><div class="d">${s.news} new · ${s.sames} same</div></div>
    </section>`;

    // Records
    const rec = [];
    const span = g => `${TT.shortDate(g.from)} → ${TT.shortDate(g.to)}`;
    if (s.longestGap) rec.push(['🏆', 'sun', 'Longest stretch, no drops', span(s.longestGap), TT.dur(s.longestGap.ms, { short: true })]);
    if (s.avgGap) rec.push(['⏱️', 'lilac', 'Average time between drops', `over ${s.gaps.length} gaps`, TT.dur(s.avgGap, { short: true })]);
    if (s.longestTube && s.news) rec.push(['💖', 'pink', 'Longest-lasting tube', `from ${TT.shortDate(s.longestTube.start)}${s.longestTube.open ? ', still going' : ''}`, TT.dur(s.longestTube.end - s.longestTube.start, { short: true })]);
    if (s.avgTubeLife) rec.push(['✨', 'pink', 'Average tube lifespan', `${s.tubes.filter(t => !t.open).length} finished tubes`, TT.dur(s.avgTubeLife, { short: true })]);
    if (s.avgRedrops != null) rec.push(['🔁', 'lilac', 'Re-drops per tube', 'on average', s.avgRedrops.toFixed(1)]);
    if (s.mostRedrops && s.mostRedrops.redrops) rec.push(['🌀', 'lilac', 'Most re-drops on one tube', `from ${TT.shortDate(s.mostRedrops.start)}`, s.mostRedrops.redrops]);
    if (s.bestCleanDays) rec.push(['🌙', 'sun', 'Most days in a row with no drop', s.cleanDays ? `current run: ${s.cleanDays}` : 'counts whole calendar days', `${s.bestCleanDays}d`]);
    if (s.busiestDay && s.busiestDay.n > 1) rec.push(['😮‍💨', '', 'Busiest day', s.busiestDay.day.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }), `${s.busiestDay.n} drops`]);
    if (s.shortestGap) rec.push(['⚡', '', 'Quickest re-drop', span(s.shortestGap), TT.dur(s.shortestGap.ms, { short: true })]);
    if (s.avgLength != null) rec.push(['📏', '', 'Average length inserted', `range ${TT.cm(s.lengthRange[0])}–${TT.cm(s.lengthRange[1])}`, TT.cm(Math.round(s.avgLength * 10) / 10)]);
    if (rec.length) h += `<h2 class="sec">Records</h2><section class="card"><ul class="records">${rec.map(([ic, tone, k, sub, v]) =>
      `<li><span class="ic ${tone}">${ic}</span><span class="k">${esc(k)}<small>${esc(sub)}</small></span><span class="val">${esc(String(v))}</span></li>`).join('')}</ul></section>`;

    // Side split
    const lp = Math.round(s.L / s.total * 100);
    h += `<h2 class="sec">Sides</h2><section class="card">
      <div class="split" role="img" aria-label="Left ${s.L}, right ${s.R}">${s.L ? `<div class="l" style="flex:${s.L}">L</div>` : ''}${s.R ? `<div class="r" style="flex:${s.R}">R</div>` : ''}</div>
      <div class="split-key"><span>Left · ${s.L} (${lp}%)</span><span>Right · ${s.R} (${100 - lp}%)</span></div></section>`;

    // Drops per day, last 14 days
    const days = [];
    const today = TT.dayStart(new Date());
    for (let i = 13; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push({ d, n: s.byDay.get(d.getTime()) || 0 }); }
    const maxD = Math.max(1, ...days.map(x => x.n));
    h += `<h2 class="sec">Last two weeks</h2><section class="card"><p class="label">Drops per day</p>
      <div class="chart" data-chart="days">${days.map((x, i) => `<div class="col" data-i="${i}"><div class="bar${x.n ? '' : ' zero'}" style="height:${x.n / maxD * 100}%"></div><span class="x">${i % 2 === 1 ? '' : x.d.toLocaleDateString([], { weekday: 'narrow' })}</span></div>`).join('')}</div>
      <div class="chart-read" id="readDays">Tap a day</div></section>`;

    // Time of day
    const buckets = ['12–3a', '3–6a', '6–9a', '9a–12', '12–3p', '3–6p', '6–9p', '9p–12'];
    const maxH = Math.max(1, ...s.hours);
    const top = s.hours.indexOf(Math.max(...s.hours));
    h += `<h2 class="sec">Time of day</h2><section class="card"><p class="label">All drops by hour</p>
      <div class="chart lilac" data-chart="hours">${s.hours.map((n, i) => `<div class="col" data-i="${i}"><div class="bar${n ? '' : ' zero'}" style="height:${n / maxH * 100}%"></div><span class="x">${buckets[i].replace('–', '-')}</span></div>`).join('')}</div>
      <div class="chart-read" id="readHours">Most drops happen <b>${buckets[top]}</b></div></section>`;

    // Full log
    h += `<h2 class="sec">Every entry</h2>`;
    let day = null;
    const list = [...evs].reverse();
    list.forEach((e, i) => {
      const dn = TT.dayName(e.at);
      if (dn !== day) { if (day) h += '</ul>'; h += `<p class="log-day">${esc(dn)}</p><ul class="log">`; day = dn; }
      const prev = list[i + 1];
      h += `<li><button type="button" data-id="${e.id}">
        <span class="tm">${esc(TT.time(e.at))}</span>
        <span class="mid"><span class="kind-pill ${e.kind}">${e.kind === 'new' ? 'New tube' : 'Same tube'}</span> ${TT.sideName(e.side)}
          <small>${[e.length_cm != null ? TT.cm(e.length_cm) : '', e.note ? esc(e.note) : ''].filter(Boolean).join(' · ') || '&nbsp;'}</small></span>
        <span class="gap">${prev ? `+${TT.dur(e.at - prev.at, { short: true })}` : 'first'}</span></button></li>`;
    });
    h += '</ul>';
    $('main').innerHTML = h;

    const read = (chart, el, fmt) => {
      const cols = [...document.querySelectorAll(`[data-chart="${chart}"] .col`)];
      const pick = i => { cols.forEach((c, j) => c.classList.toggle('dim', j !== i)); $(el).innerHTML = fmt(i); };
      cols.forEach((c, i) => { c.onclick = () => pick(i); c.onmouseenter = () => pick(i); });
      document.querySelector(`[data-chart="${chart}"]`).onmouseleave = () => cols.forEach(c => c.classList.remove('dim'));
    };
    read('days', 'readDays', i => `<b>${esc(days[i].d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }))}</b>: ${days[i].n} drop${days[i].n === 1 ? '' : 's'}`);
    read('hours', 'readHours', i => `<b>${buckets[i]}</b>: ${s.hours[i]} drop${s.hours[i] === 1 ? '' : 's'} (${Math.round(s.hours[i] / s.total * 100)}%)`);
    document.querySelectorAll('.log button').forEach(b => b.onclick = () => openSheet(evs.find(e => e.id === Number(b.dataset.id))));
  }

  // ----- edit sheet -----
  const sheet = $('sheet'), bg = $('sheetBg');
  let editing = null, pick = {};
  function seg() {
    sheet.querySelectorAll('.seg2').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', pick[g.dataset.field] === b.dataset.v)));
  }
  sheet.querySelectorAll('.seg2 button').forEach(b => b.onclick = () => { pick[b.parentNode.dataset.field] = b.dataset.v; seg(); });
  function openSheet(e) {
    editing = e; pick = { kind: e.kind, side: e.side };
    sheet.at.value = TT.toInput(e.at); sheet.at.max = TT.toInput(new Date());
    sheet.len.value = e.length_cm ?? ''; sheet.note.value = e.note || '';
    seg(); sheet.classList.add('open'); bg.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet() { sheet.classList.remove('open'); bg.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true'); editing = null; }
  bg.onclick = closeSheet;
  sheet.onsubmit = async ev => {
    ev.preventDefault();
    const body = { at: new Date(sheet.at.value).toISOString(), kind: pick.kind, side: pick.side, length_cm: sheet.len.value === '' ? null : Number(sheet.len.value), note: sheet.note.value.trim() || null };
    try {
      const { event } = await TT.api('/events/' + editing.id, { method: 'PATCH', body });
      evs = evs.map(e => (e.id === event.id ? TT.parse(event) : e)).sort((a, b) => a.at - b.at || a.id - b.id);
      TT.remember(evs); closeSheet(); render(); TT.toast('Saved ✦');
    } catch (err) { TT.toast(err.message, { err: true }); }
  };
  $('delBtn').onclick = async () => {
    if (!editing || !confirm(`Delete the ${TT.kindName(editing.kind).toLowerCase()} entry from ${TT.when(editing.at)}?`)) return;
    try {
      await TT.api('/events/' + editing.id, { method: 'DELETE' });
      evs = evs.filter(e => e.id !== editing.id); TT.remember(evs); closeSheet(); render(); TT.toast('Deleted');
    } catch (err) { TT.toast(err.message, { err: true }); }
  };

  if (evs.length) render();
  TT.events().then(e => { evs = e; render(); }).catch(err => { $('loadErr').textContent = "Couldn't load: " + err.message; $('loadErr').hidden = false; });
  setInterval(() => { if (!editing && evs.length) render(); }, 60e3);
})();
</script>
</body>
</html>
