<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1430" media="(prefers-color-scheme: dark)">
<title>TaraTube trophies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff7aa2' d='M12 1.8l2.9 6.4 6.9.7-5.2 4.6 1.5 6.8L12 16.8l-6.1 3.5 1.5-6.8L2.2 8.9l6.9-.7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tt.css">
<style>
  .wrap { padding-bottom: 60px; }
  .top-btns { display: flex; gap: 8px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .summary .card { margin: 0; padding: 12px; text-align: center; }
  .summary b { display: block; font: 600 26px/1 var(--display); }
  .summary span { font-size: 12px; font-weight: 700; color: var(--muted); }
  h2.sec { font: 600 21px/1.1 var(--display); margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
  h2.sec::before { content: "✦"; color: var(--sun); font-size: 16px; }
  h2.sec small { margin-left: auto; font: 700 13px/1 var(--body); color: var(--muted); }

  /* The cabinet: wooden-ish shelves of medals */
  .cabinet { background: linear-gradient(var(--surface), var(--surface-2)); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px 10px 4px; }
  .shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 7px solid color-mix(in srgb, var(--peach) 55%, var(--surface)); border-radius: 0 0 4px 4px; }
  .shelf:last-child { margin-bottom: 0; }
  .tro { border: 0; background: none; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; min-width: 0; }
  .tro .m { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; line-height: 1;
    background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c1) 35%, #fff) 60%, var(--c1));
    box-shadow: inset 0 -4px 0 color-mix(in srgb, var(--c2) 45%, transparent), 0 0 0 3px color-mix(in srgb, var(--c2) 30%, var(--surface)); transition: transform .15s; }
  .tro:active .m { transform: scale(.92); }
  .tro .nm { font: 700 11.5px/1.15 var(--body); text-align: center; max-width: 100%; overflow-wrap: anywhere; }
  .tro .x { position: absolute; top: 0; right: 4px; background: var(--ink); color: var(--bg); border-radius: 999px; font: 800 11px/1 var(--body); padding: 3px 6px; }
  .tro.locked .m { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); filter: grayscale(1); opacity: .45; font-size: 26px; }
  .tro.locked .nm { color: var(--muted); }
  .tro.secret .m { filter: none; opacity: .6; color: var(--muted); font: 600 26px/1 var(--display); }

  .stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stk { border: 0; background: var(--surface-2); border-radius: 16px; aspect-ratio: 1; display: grid; place-items: center; font-size: 28px; position: relative; padding: 0; }
  .stk.got { background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 30%, var(--surface)), color-mix(in srgb, var(--c2) 30%, var(--surface))); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c2) 40%, transparent); }
  .stk:not(.got) { filter: grayscale(1) brightness(0); opacity: .12; }
  .stk .x { position: absolute; bottom: 2px; right: 4px; font: 800 10px/1 var(--body); color: var(--ink); }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; }
  .feed .ic { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--c1) 40%, #fff)); }
  .feed .t { flex: 1; font-weight: 800; font-size: 15px; min-width: 0; }
  .feed .t small { display: block; font-weight: 600; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .feed .d { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; white-space: nowrap; }
  .feed .d b { display: block; color: var(--c2); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .more { display: block; margin: 6px auto 0; }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); font-weight: 700; }
  .snd { border: 0; }
  .peek { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(40,15,45,.4); padding: 24px; }
  .peek > div { background: var(--surface); border-radius: 24px; padding: 22px; text-align: center; max-width: 300px; box-shadow: var(--shadow); }
  .peek .m { font-size: 44px; filter: grayscale(1); opacity: .5; }
  .peek h3 { font: 600 22px/1.1 var(--display); margin: 8px 0 6px; }
  .peek p { margin: 0; color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">
      <span id="brandStar"></span>
      <div><span style="font:600 28px/1 var(--display)">Tara<b style="color:var(--blush);font-weight:600">Tube</b></span><small>trophy cabinet</small></div>
    </a>
    <div class="top-btns">
      <button class="pill-btn snd" id="snd" type="button" aria-label="Sound"></button>
      <a class="pill-btn" href="../">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</a>
    </div>
  </header>
  <p class="err-line" id="loadErr" hidden style="color:var(--blush-deep);font-weight:700;text-align:center"></p>
  <div id="main"><div class="empty">Loading…</div></div>
</div>

<script src="../tt.js"></script>
<script src="../tt-awards.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  TT.sky();
  $('brandStar').outerHTML = TT.STAR;
  const esc = TT.esc;
  let evs = TT.cached(), awards = [], showAll = false;
  const vars = r => `--c1:${TTA.RAR[r].c1};--c2:${TTA.RAR[r].c2}`;
  const when = d => d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + TT.time(d);

  const snd = () => { $('snd').textContent = TTA.muted() ? '🔇' : '🔊'; };
  $('snd').onclick = () => { TT.store.set('tt.mute', TTA.muted() ? '0' : '1'); snd(); };
  snd();

  function render() {
    if (!evs.length) { $('main').innerHTML = `<div class="empty">${TT.STAR}<p>No trophies yet.<br>Every tube you log earns one.</p><a class="pill-btn" href="../">Log one</a></div>`; return; }
    awards = TTA.compute(evs);
    const sh = TTA.shelf(awards);
    const ach = TTA.ACH, stk = TTA.STICKERS;
    const gotA = ach.filter(a => sh.has(a.id)).length, gotS = stk.filter(s => sh.has(s.id)).length;
    let h = `<section class="summary">
      <div class="card"><b>${awards.length}</b><span>awards won</span></div>
      <div class="card"><b>${gotA}<small style="font-size:.5em;color:var(--muted)">/${ach.length}</small></b><span>trophies</span></div>
      <div class="card"><b>${gotS}<small style="font-size:.5em;color:var(--muted)">/${stk.length}</small></b><span>stickers</span></div></section>`;

    // Trophy shelves: earned first by rarity, then locked.
    const order = [...ach].sort((a, b) => (sh.has(b.id) - sh.has(a.id)) || (TTA.RAR[b.rarity].n - TTA.RAR[a.rarity].n));
    h += `<h2 class="sec">Trophies <small>tap one</small></h2><section class="cabinet">`;
    for (let k = 0; k < order.length; k += 4) {
      h += '<div class="shelf">' + order.slice(k, k + 4).map(a => {
        const got = sh.get(a.id);
        if (got) return `<button type="button" class="tro" data-id="${a.id}" style="${vars(a.rarity)}"><span class="m">${a.icon}</span><span class="nm">${esc(a.name)}</span>${got.length > 1 ? `<span class="x">×${got.length}</span>` : ''}</button>`;
        if (a.secret) return `<button type="button" class="tro locked secret" data-lock="${a.id}"><span class="m">?</span><span class="nm">Secret</span></button>`;
        return `<button type="button" class="tro locked" data-lock="${a.id}"><span class="m">${a.icon}</span><span class="nm">${esc(a.name)}</span></button>`;
      }).join('') + '</div>';
    }
    h += '</section>';

    h += `<h2 class="sec">Sticker book <small>${gotS} of ${stk.length}</small></h2><section class="card"><div class="stickers">` +
      stk.map(s => { const got = sh.get(s.id); return `<button type="button" class="stk${got ? ' got' : ''}" ${got ? `data-id="${s.id}"` : 'disabled aria-label="Not found yet"'} style="${vars(s.rarity)}">${s.icon}${got && got.length > 1 ? `<span class="x">×${got.length}</span>` : ''}</button>`; }).join('') +
      '</div></section>';

    const feed = [...awards].reverse();
    const shown = showAll ? feed : feed.slice(0, 25);
    h += `<h2 class="sec">Award log <small>${awards.length} total</small></h2><ul class="feed">` + shown.map((a, k) => `<li><button type="button" data-feed="${k}" style="${vars(a.def.rarity)}">
      <span class="ic">${a.def.icon}</span><span class="t">${esc(a.def.name)}<small>${esc(a.detail)}</small></span>
      <span class="d"><b>${TTA.RAR[a.def.rarity].label}</b>${esc(when(a.at))}</span></button></li>`).join('') + '</ul>';
    if (!showAll && feed.length > 25) h += `<button class="pill-btn more" id="more" type="button">Show all ${feed.length}</button>`;
    $('main').innerHTML = h;

    document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      TTA.unlock();
      const list = sh.get(b.dataset.id);
      const last = list[list.length - 1];
      TTA.reveal({ ...last, n: list.length }, { capsule: false, history: [...list].reverse() });
    });
    document.querySelectorAll('[data-feed]').forEach(b => b.onclick = () => { TTA.unlock(); TTA.reveal(shown[b.dataset.feed], { capsule: false }); });
    document.querySelectorAll('[data-lock]').forEach(b => b.onclick = () => {
      const a = TTA.BY[b.dataset.lock];
      const p = document.createElement('div'); p.className = 'peek';
      p.innerHTML = `<div><div class="m">${a.secret ? '❓' : a.icon}</div><h3>${a.secret ? 'Secret trophy' : esc(a.name)}</h3><p>${a.secret ? 'Keep logging to find out…' : esc(a.hint)}</p><p style="margin-top:8px;font-size:12px">${TTA.RAR[a.rarity].label} · tap to close</p></div>`;
      p.onclick = () => p.remove(); document.body.appendChild(p);
    });
    const more = $('more'); if (more) more.onclick = () => { showAll = true; render(); };
  }

  if (evs.length) render();
  TT.events().then(e => { evs = e; render(); }).catch(err => { $('loadErr').textContent = "Couldn't load: " + err.message; $('loadErr').hidden = false; });
})();
</script>
</body>
</html>
