<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Last Mile tester stats</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column of collapsible sections (highlights, engine vs players, testers, job by job). On a
   phone the testers table turns into a card per tester and the job grid shrinks. */
:root{
  --bg:#f6f4fb; --panel:#ffffff; --fg:#2b2233; --soft:#6f6780; --line:#e4e0ee; --reach:#efecf6;
  --diff:#ff5a4e; --fun:#22b46b; --frus:#7b5cff; --dot:#8f86a3;
  --display:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141f; --panel:#201c2b; --fg:#efeaf7; --soft:#a49cb6; --line:#332d42; --reach:#29243a;
  --diff:#ff6b5f; --fun:#3fd486; --frus:#9a83ff; --dot:#8b829e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141f; --panel:#201c2b; --fg:#efeaf7; --soft:#a49cb6; --line:#332d42; --reach:#29243a;
  --diff:#ff6b5f; --fun:#3fd486; --frus:#9a83ff; --dot:#8b829e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;line-height:1.1}
.muted{color:var(--soft)}
.small{font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .acts{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:9px 14px;background:var(--frus);color:#fff;cursor:pointer}
.btn.quiet{background:var(--reach);color:var(--fg)}
.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--fun);outline-offset:2px}

/* Sections */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:baseline;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
details.sec>summary .hint{color:var(--soft);font-size:12px;margin-left:auto;white-space:nowrap}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);margin-left:6px;align-self:center;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary:has(.hint)::after{margin-left:6px}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.note{color:var(--soft);font-size:12px;max-width:75ch;margin:0}

/* Highlights */
.tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.top{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.top h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.top h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.top ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.top li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.top li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top li .v{font-weight:600;font-variant-numeric:tabular-nums}
.top li .s{grid-column:1/-1;color:var(--soft);font-size:11px;margin-top:-2px}

/* Engine vs players */
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:76px 1fr 92px;gap:10px;align-items:center}
.tier .nm{font-weight:600}
.track{position:relative;height:12px;border-radius:99px;background:var(--reach)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--diff)}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--soft);opacity:.5}
.tier .v{font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.verdict{border-left:3px solid var(--frus);padding:4px 0 4px 10px;margin:0}
.surp{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Testers: a table on wide screens, a card each on phones */
.tscroll{overflow-x:auto}
table.people{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.people th,.people td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.people thead th{font-weight:600;font-size:12px;color:var(--soft);vertical-align:bottom}
.people thead tr.grp th{color:var(--fg);font-family:var(--display);font-size:13px;text-align:center;border-bottom:0;padding-bottom:0}
.people th:first-child,.people td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.people tbody tr:last-child td{border-bottom:0}
.people .sep{border-left:1px solid var(--line)}
.dd{color:var(--diff);font-weight:600}.ff{color:var(--fun);font-weight:600}.xx{color:var(--frus);font-weight:600}
.nil{color:var(--soft);font-weight:400}
.cards{display:none;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:12px}
.card>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.card>summary::-webkit-details-marker{display:none}
.card>summary b{font-family:var(--display);font-size:15px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--reach)}
.cgrid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 10px;padding:0 12px 12px;font-variant-numeric:tabular-nums;font-size:13px}
.cgrid .h{color:var(--soft);font-size:11px}
.cgrid .r{color:var(--soft)}
.help{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 12px 12px;text-align:center;font-variant-numeric:tabular-nums}
.help div{background:var(--reach);border-radius:8px;padding:6px 2px}
.help small{display:block;color:var(--soft);font-size:10px}

/* Job by job grid */
.key{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.key .item{display:flex;align-items:center;gap:10px;min-width:0}
.key svg{flex:none}
.key small{color:var(--soft);display:block;font-size:12px}
.scroller{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:12px}
#grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
#grid th,#grid td{padding:0}
#grid thead th{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);vertical-align:bottom;padding:10px 4px 8px;min-width:66px;text-align:center}
#grid thead th:first-child{left:0;z-index:3;min-width:0;width:34px}
#grid .ph{font-family:var(--display);font-weight:600;font-size:14px}
#grid .meta{color:var(--soft);font-size:11px;font-weight:400;line-height:1.3}
#grid .far{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--reach)}
#grid tbody th{position:sticky;left:0;z-index:1;background:var(--panel);text-align:center;font-weight:400;padding:0 6px;border-right:1px solid var(--line);width:34px;cursor:default}
#grid .jn{font-family:var(--display);font-weight:600;font-size:14px}
#grid td{text-align:center;height:58px}
#grid td.r{background:var(--reach)}
#grid tr.zone td,#grid tr.zone th{border-top:1px solid var(--line)}
#grid td svg{display:block;margin:auto}
#grid td.all{border-left:1px solid var(--line)}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:12px;max-width:260px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip b{font-family:var(--display);font-size:14px;font-weight:600}

.gate{max-width:420px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.gate label{font-weight:600}
.gate input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.gate .check{font-weight:400;display:flex;gap:8px;align-items:center;color:var(--soft)}
.error{color:var(--diff);min-height:1em;margin:0}

@media (max-width:720px){
  h1{font-size:24px}
  .tscroll{display:none}
  .cards{display:flex}
  #grid thead th{min-width:46px;padding:8px 2px 6px}
  #grid .meta{display:none}
  #grid td{height:46px}
  #grid td svg{width:40px;height:40px}
  .tier{grid-template-columns:64px 1fr 80px}
  details.sec>summary .hint{display:none}
  .top li:nth-child(n+4){display:none}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="tip" hidden></div>
<script>
// Last Mile's testers: how far each got, and what they rated each job. The ratings come live from the
// MusicGrid server's GET /lm/ratings, which only answers with the admin key (the same one as /stats/).
// Nothing is shown, or even fetched, without it. engine.json (next to this page) is what the level
// engine planned for each job: its tier and its score, no maps or titles. It's made from the game repo.
const API = "https://music-grid-io-42616e204fd3.herokuapp.com";
const app = document.getElementById("app");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let key = store.get("sh:adminKey") || "";
let P = [], T = {}, ROWS = [], ENGINE = {}, RAW = [];
// "Since your last visit": the newest record seen on this browser's last visit. A refresh in the same
// sitting keeps the same starting point (sessionStorage), so the summary doesn't empty itself.
const sess = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
let BASE = null, SINCE = "visit";
const PAST = 11;          // "job 11 on": past the tutorial and easy jobs, where help gets limited

// Anyone can send a rating, so everything a tester's phone sent is escaped before it's shown.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(v); return n >= 1 && n <= 5 ? n : null; };
const mean = v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
const median = v => { if (!v.length) return null; const s = [...v].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const NIL = '<span class="nil">–</span>';
const f1 = v => v == null ? NIL : v.toFixed(1);
const am = v => v.length ? `${mean(v).toFixed(1)} <span class="nil">/</span> ${median(v).toFixed(1)}` : NIL;
const secs = v => v == null ? NIL : (v >= 60 ? `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, '0')}` : `${Math.round(v)}s`);

function gate(message = "") {
  app.innerHTML = `
    <form class="gate" id="gate">
      <h1>Last Mile testers</h1>
      <p class="muted">Use the ADMIN_KEY from the MusicGrid Heroku app.</p>
      <label for="key">Admin key</label>
      <input type="password" id="key" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="remember" checked> Remember the key on this browser</label>
      <button class="btn" type="submit">Show testers</button>
      <p class="error" role="alert">${esc(message)}</p>
    </form>`;
  document.getElementById("key").focus();
  document.getElementById("gate").addEventListener("submit", e => {
    e.preventDefault();
    key = document.getElementById("key").value.trim();
    if (document.getElementById("remember").checked) store.set("sh:adminKey", key); else store.del("sh:adminKey");
    load();
  });
}

let fetchedAt = null;
async function load(quiet = false) {
  if (!key) return gate();
  if (!quiet) app.innerHTML = `<p class="muted">Loading testers…</p>`;
  let res;
  try {
    res = await fetch(`${API}/lm/ratings?limit=20000`, { headers: { "x-admin-key": key } });
  } catch {
    const rb = quiet && document.getElementById('refresh');
    if (rb) { rb.disabled = false; rb.textContent = "Couldn't reach it. Retry"; return; }
    return gate("Couldn't reach the MusicGrid server. If it was asleep, try again in a few seconds.");
  }
  if (res.status === 401) { store.del("sh:adminKey"); key = ""; return gate("That key didn't work. Check ADMIN_KEY in the MusicGrid Heroku config vars."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return gate(data.error || `The server answered with an error (${res.status}).`);
  try { ENGINE = (await (await fetch("engine.json", { cache: "no-cache" })).json()).jobs || {}; } catch { ENGINE = {}; }
  build(data.ratings || []);
  const newest = RAW.length ? String(RAW[RAW.length - 1].receivedAt) : "";
  BASE = sess.get("lm:stats:base");
  if (BASE === null) { BASE = store.get("lm:stats:seen") || ""; sess.set("lm:stats:base", BASE); }
  if (newest) store.set("lm:stats:seen", newest);
  fetchedAt = new Date();
  const y = scrollY;
  render();
  if (quiet) scrollTo(0, y);
}

// Which layout of its job a rating was for (1 = the first), as tools/ratings.py works it out: the game
// sends it since build 24, and before that the job's fingerprint finds it in the layouts' history.
function layoutOf(r) {
  const v = Number((r.stats || {}).level_version);
  if (v) return v;
  const fps = (ENGINE[r.level] || {}).fps || [];
  const fp = Number(r.levelFp);
  for (let i = fps.length - 1; i >= 0; i--) if (fps[i] === fp) return i + 1;
  return 0;
}
const isCurrent = r => { const e = ENGINE[r.level]; return e && e.fps && layoutOf(r) === e.fps.length; };

// One column per phone: the jobs it reached and its latest rating of each (as tools/ratings.py reads them).
function build(rows) {
  rows.sort((a, b) => String(a.receivedAt).localeCompare(String(b.receivedAt)));
  RAW = rows;
  const devs = new Map();
  T = {};
  ROWS = [];
  for (const r of rows) {
    const id = String(r.device || "").slice(0, 8);
    if (!id) continue;
    const st = r.stats || {};
    if (!devs.has(id)) devs.set(id, { id, cells: {}, furthest: 0, last: "", phone: "", tz: "", build: "", n_rated: 0, sessions: new Set(), runs: {} });
    const d = devs.get(id);
    if (r.session) d.sessions.add(String(r.session));
    const at = String(r.receivedAt || "").slice(0, 16);
    if (at > d.last) d.last = at;
    d.build = String(r.version || d.build);
    if (st.device_model) d.phone = String(st.device_model);
    if (st.time_zone) d.tz = String(st.time_zone);
    if (typeof st.notify === "string") d.notify = st.notify;      // (push choices: sent since build 33)
    d.furthest = Math.max(d.furthest, Number(st.levels_done) || 0);
    const m = /^Level (\d+)$/.exec(String(r.where || ""));
    if (!m) continue;
    const n = Number(m[1]);
    const won = st.record !== "play" || st.outcome === "won";
    // The job's latest record stands for it (the game's counts add up over its tries until a win).
    // A win's seconds_active already holds every try; an unfinished try adds this one's seconds.
    const run = { secs: (Number(st.seconds_active) || 0) + (won ? 0 : Number(st.seconds_this_try) || 0) };
    for (const [k, f] of [["hints", "hints"], ["calls", "radio"], ["undos", "undos"], ["restarts", "restarts"]]) if (f in st) run[k] = Number(st[f]) || 0;
    if (!(d.runs[n] && d.runs[n].won && !won)) d.runs[n] = { ...run, won };
    const c = d.cells[n] || (d.cells[n] = { won: false, played: true });
    if (won) { c.won = true; d.furthest = Math.max(d.furthest, n); }
    if (r.title) { c.title = String(r.title); T[n] = String(r.title); }
    const dd = num(r.difficulty), ff = num(r.fun), xx = num(r.frustration);
    if (dd || ff || xx) {
      Object.assign(c, { d: dd, f: ff, x: xx, v: String(r.version || ""), tags: Array.isArray(r.tags) ? r.tags.map(String) : [], note: String(r.note || "") });
      ROWS.push({ dev: id, n, title: String(r.title || ""), d: dd, f: ff, x: xx, cur: isCurrent(r), layout: layoutOf(r) });
    }
  }
  // (A phone with only a couple of records is a test run, not a tester.)
  P = [...devs.values()].filter(d => Object.keys(d.cells).length >= 3).sort((a, b) => b.furthest - a.furthest);
  for (const d of P) d.n_rated = Object.values(d.cells).filter(c => c.d || c.f || c.x).length;     // (jobs rated, not ratings sent)
  const keep = new Set(P.map(p => p.id));
  ROWS = ROWS.filter(r => keep.has(r.dev));
}

// Each tester's latest rating of each layout: what the highlights and the engine check count.
function latestRatings() {
  const by = new Map();
  for (const r of ROWS) by.set(`${r.dev}|${r.n}|${r.layout}|${r.title}`, r);
  return [...by.values()];
}

function rings(d, f, x, size = 52) {
  // Outer ring: difficulty. Middle ring: fun. Inner ring: frustration.
  // Each score fills its ring's circumference: 1/5 goes a fifth of the way round from the top, 5/5 closes it.
  const ring = (r, w, v, c) => v
    ? `<circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/>` +
      `<circle cx="30" cy="30" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" pathLength="100" stroke-dasharray="${v * 20} 100" transform="rotate(-90 30 30)"/>`
    : `<circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" aria-hidden="true">
    ${ring(25, 6, d, 'var(--diff)')}${ring(17, 6, f, 'var(--fun)')}${ring(9, 6, x, 'var(--frus)')}
  </svg>`;
}
const dot = filled => `<svg width="52" height="52" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="5" fill="${filled ? 'var(--dot)' : 'none'}" stroke="var(--dot)" stroke-width="2"/></svg>`;
const fmtTime = s => { const d = new Date(s + 'Z'); return isNaN(d) ? '' : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const PHONES = { 'iPhone17,1': 'iPhone 16 Pro', 'iPhone17,2': 'iPhone 16 Pro Max', 'iPhone17,3': 'iPhone 16', 'iPhone17,4': 'iPhone 16 Plus', 'iPhone16,1': 'iPhone 15 Pro', 'iPhone16,2': 'iPhone 15 Pro Max', 'iPhone15,4': 'iPhone 15', 'iPhone15,5': 'iPhone 15 Plus', 'iPhone15,2': 'iPhone 14 Pro', 'iPhone15,3': 'iPhone 14 Pro Max', 'iPhone14,7': 'iPhone 14', 'iPhone14,2': 'iPhone 13 Pro', 'iPhone14,3': 'iPhone 13 Pro Max', 'iPhone14,5': 'iPhone 13' };
const phoneName = p => PHONES[p] || (p && p !== '?' ? p : 'Unknown phone');
const tzName = t => { const m = /\(UTC([+-]\d+):\d+\)/.exec(t || ''); if (!m) return ''; return ({ '-5': 'Eastern', '-6': 'Central', '-7': 'Mountain', '-8': 'Pacific', '+0': 'UK' })[m[1]] || 'UTC' + m[1]; };
const buildOf = v => (/\((\d+)\)/.exec(v || '') || [])[1] || '?';
const wide = () => matchMedia('(min-width: 721px)').matches;

function section(id, title, hint, open, body) {
  return `<details class="sec" id="${id}" ${open ? 'open' : ''}><summary><h2>${title}</h2>${hint ? `<span class="hint">${hint}</span>` : ''}</summary><div class="body">${body}</div></details>`;
}

function render() {
  const total = P.reduce((a, p) => a + p.n_rated, 0);
  const latest = P.length ? fmtTime(P.map(p => p.last).sort().pop()) : '';
  app.innerHTML = `
    <div class="bar">
      <div><h1>Last Mile testers</h1><div class="muted small">${P.length} testers · ${total} jobs rated · latest record ${esc(latest)}</div><div class="muted small" id="fetched"></div></div>
      <div class="acts"><button class="btn" type="button" id="refresh">Refresh</button><button class="btn quiet" type="button" id="out">Forget key</button></div>
    </div>
    ${section('s-new', 'Since your last visit', '', true, '<div id="since"></div>')}
    ${section('s-high', 'Best and worst jobs', 'by average rating', true, highlights())}
    ${section('s-engine', 'Engine vs players', 'planned tier vs rated difficulty', true, engineCheck())}
    ${section('s-people', 'Testers', `${P.length}`, true, `<div class="tscroll"><table class="people" id="people"></table></div><div class="cards" id="cards"></div>
      <p class="note">Ratings are out of 5, shown as average / median over the jobs each tester rated. "Job ${PAST} on" leaves out jobs 1 to ${PAST - 1}, the tutorial and easy jobs, where help is still unlimited. Time and help are per job played, from each job's latest record (all its tries together). Help counts only start where a tester's build began sending them.</p>`)}
    ${section('s-push', 'Push notifications', 'what testers opted into', true, pushes())}
    ${section('s-grid', 'Job by job', 'rings per job', wide(), `
      <details><summary class="muted small" style="cursor:pointer">How to read the rings</summary><div class="key" id="key" style="margin-top:10px"></div>
      <p class="note" style="margin-top:10px">Each column is a tester, each row a job; shaded cells are jobs they've reached. Tap a cell for the numbers, or a job number for its title. Job numbers are where each job sat when it was played: several early jobs were redesigned since, so a rating may be for an older layout. Play records only start at build 28, so earlier jobs show shaded with no mark if the tester beat them before then.</p></details>
      <div class="scroller"><table id="grid"></table></div>`)}`;
  const rb = document.getElementById('refresh');
  rb.addEventListener('click', async () => {
    rb.disabled = true; rb.textContent = 'Refreshing…';
    await load(true);
  });
  const stamp = () => { const f = document.getElementById('fetched'); if (f && fetchedAt) { const m = Math.round((Date.now() - fetchedAt) / 60000); f.textContent = 'Fetched ' + (m < 1 ? 'just now' : m === 1 ? 'a minute ago' : m < 60 ? m + ' minutes ago' : fetchedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })); } };
  stamp();
  clearInterval(window.__stamp); window.__stamp = setInterval(stamp, 30000);
  document.getElementById('out').addEventListener('click', () => { store.del('sh:adminKey'); key = ''; gate(); });
  // Remember which sections are folded, on this browser.
  for (const s of document.querySelectorAll('details.sec')) {
    const k = 'lm:stats:' + s.id, saved = store.get(k);
    if (saved !== null) s.open = saved === '1';
    s.addEventListener('toggle', () => store.set(k, s.open ? '1' : '0'));
  }
  since();
  peopleTable();
  peopleCards();
  grid();
}

// What testers did after a point: the last visit on this browser, or the last day or week.
function since() {
  const box = document.getElementById('since');
  const now = RAW.length ? new Date(RAW[RAW.length - 1].receivedAt) : new Date();
  const ago = h => new Date(now - h * 3600e3).toISOString();
  const cut = SINCE === 'day' ? ago(24) : SINCE === 'week' ? ago(24 * 7) : (BASE || '');
  const pick = `<div class="acts" style="display:flex;gap:6px;flex-wrap:wrap">${[['visit', 'Last visit'], ['day', '24 hours'], ['week', '7 days']].map(([k, l]) =>
    `<button class="btn ${SINCE === k ? '' : 'quiet'}" type="button" data-since="${k}" style="padding:6px 12px;font-size:13px">${l}</button>`).join('')}</div>`;
  const wire = () => box.querySelectorAll('[data-since]').forEach(b => b.addEventListener('click', () => { SINCE = b.dataset.since; since(); }));
  if (SINCE === 'visit' && !BASE) {
    box.innerHTML = pick + '<p class="note" style="margin-top:10px">First visit on this browser. Next time, this shows what testers did since now.</p>';
    return wire();
  }
  const label = new Map(P.map((p, i) => [p.id, `Tester ${i + 1}`]));
  const after = RAW.filter(r => String(r.receivedAt) > cut);
  const when = fmtTime(String(cut).slice(0, 16));
  if (!after.length) {
    box.innerHTML = pick + `<p class="note" style="margin-top:10px">Nothing new since ${esc(when)}.</p>`;
    return wire();
  }
  // Each tester's furthest job by the cut, the same way the table works it out.
  const reach = id => {
    let f = 0;
    for (const r of RAW) {
      if (String(r.receivedAt) > cut) break;
      if (String(r.device || '').slice(0, 8) !== id) continue;
      const st = r.stats || {};
      f = Math.max(f, Number(st.levels_done) || 0);
      const m = /^Level (\d+)$/.exec(String(r.where || ''));
      if (m && (st.record !== 'play' || st.outcome === 'won')) f = Math.max(f, Number(m[1]));
    }
    return f;
  };
  const who = new Map();
  let others = new Set();
  for (const r of after) {
    const id = String(r.device || '').slice(0, 8);
    if (!label.has(id)) { others.add(id); continue; }
    const st = r.stats || {};
    const w = who.get(id) || { jobs: new Set(), won: new Set(), rated: 0, left: [], daily: null, detours: new Set(), notes: [], first: !RAW.some(x => String(x.device || '').slice(0, 8) === id && String(x.receivedAt) <= cut) };
    const where = String(r.where || '');
    const m = /^Level (\d+)$/.exec(where);
    const won = st.record !== 'play' || st.outcome === 'won';
    if (m) { w.jobs.add(+m[1]); if (won) w.won.add(+m[1]); else if (['left', 'skipped'].includes(st.outcome)) w.left.push(+m[1]); }
    else if (where.startsWith('Daily')) w.daily = won ? 'solved' : (w.daily || 'tried');
    else if (where.startsWith('Side road')) w.detours.add(where.replace(/^Side road /, '').replace(/, part \d+$/, ''));
    if (num(r.difficulty) || num(r.fun) || num(r.frustration)) w.rated++;
    if (r.note) w.notes.push({ where: m ? `job ${m[1]}` : where.replace(/^Side road /, ''), note: String(r.note) });
    who.set(id, w);
  }
  const ids = [...who.keys()].sort((a, b) => label.get(a).localeCompare(label.get(b), undefined, { numeric: true }));
  const jobsPlayed = ids.reduce((a, id) => a + who.get(id).jobs.size, 0);
  const ratings = ids.reduce((a, id) => a + who.get(id).rated, 0);
  const fresh = ids.filter(id => who.get(id).first).length;
  const head = [`<b>${ids.length}</b> tester${ids.length === 1 ? '' : 's'} played`, `<b>${jobsPlayed}</b> job${jobsPlayed === 1 ? '' : 's'}`, `<b>${ratings}</b> rating${ratings === 1 ? '' : 's'}`]
    .concat(fresh ? [`<b>${fresh}</b> new tester${fresh === 1 ? '' : 's'}`] : []).join(' · ');
  const lines = ids.map(id => {
    const w = who.get(id), p = P.find(x => x.id === id), was = reach(id);
    const bits = [];
    if (w.first) bits.push('<span class="chip">new</span>');
    if (p.furthest > was) bits.push(was ? `job <b>${was} → ${p.furthest}</b>` : `reached job <b>${p.furthest}</b>`);
    if (w.jobs.size) bits.push(`${w.jobs.size} job${w.jobs.size === 1 ? '' : 's'} played`);
    if (w.rated) bits.push(`${w.rated} rated`);
    if (w.daily) bits.push(`${w.daily} the daily`);
    if (w.detours.size) bits.push(`detour${w.detours.size > 1 ? 's' : ''}: ${esc([...w.detours].join(', '))}`);
    const quit = [...new Set(w.left)].filter(n => !w.won.has(n));
    if (quit.length) bits.push(`<span class="dd">left job${quit.length > 1 ? 's' : ''} ${quit.join(', ')} unbeaten</span>`);
    return `<li><b>${label.get(id)}</b> <span class="muted small">${esc(phoneName(p.phone))}</span><br>${bits.join(' · ')}</li>`;
  }).join('');
  const notes = ids.flatMap(id => who.get(id).notes.map(n => `<li><b>${label.get(id)}</b>, ${esc(n.where)}: “${esc(n.note)}”</li>`)).join('');
  box.innerHTML = pick + `<p style="margin:10px 0 6px">Since ${esc(when)}: ${head}.</p>
    <ul class="surp">${lines}</ul>
    ${notes ? `<div style="margin-top:10px"><b>New notes</b><ul class="surp">${notes}</ul></div>` : ''}
    ${others.size ? `<p class="note" style="margin-top:8px">Plus ${others.size} phone${others.size === 1 ? '' : 's'} that sent only a record or two (not counted as testers).</p>` : ''}`;
  wire();
}

// The best and worst: each layout's average over its testers, top few of each score.
function highlights() {
  const groups = new Map();
  for (const r of latestRatings()) {
    const g = groups.get(r.title + '|' + r.n) || { n: r.n, title: r.title, cur: r.cur, d: [], f: [], x: [] };
    for (const k of ['d', 'f', 'x']) if (r[k]) g[k].push(r[k]);
    groups.set(r.title + '|' + r.n, g);
  }
  const all = [...groups.values()];
  const list = (k, label, color, low) => {
    // The layouts in the game now, unless there are too few of those rated yet.
    const rated = all.filter(g => g[k].length);
    const pool = rated.filter(g => g.cur).length >= 5 ? rated.filter(g => g.cur) : rated;
    const multi = pool.filter(g => g[k].length >= 2);
    const use = multi.length >= 5 ? multi : pool;      // (two ratings or more, once there are enough of those)
    const top = use.sort((a, b) => (low ? mean(a[k]) - mean(b[k]) : mean(b[k]) - mean(a[k])) || b[k].length - a[k].length).slice(0, 5);
    return `<div class="top"><h3><i style="background:${color}"></i>${label}</h3><ol>${top.map(g => `<li>
      <span class="t">Job ${g.n} “${esc(g.title)}”</span><span class="v" style="color:${color}">${mean(g[k]).toFixed(1)}</span>
      <span class="s">${g[k].length} rating${g[k].length > 1 ? 's' : ''}${g.cur ? '' : ' · an older layout'}</span></li>`).join('') || '<li class="muted">No ratings yet</li>'}</ol></div>`;
  };
  return `<div class="tops">
    ${list('d', 'Hardest', 'var(--diff)')}
    ${list('f', 'Most fun', 'var(--fun)')}
    ${list('x', 'Most frustrating', 'var(--frus)')}
    ${list('f', 'Least fun', 'var(--soft)', true)}
  </div><p class="note">Each job layout's average across the testers who rated it: the layouts in the game now once five or more are rated, and jobs with two or more ratings once there are enough of those.</p>`;
}

// What each tester chose to hear about (the game's Notifications card), from their latest record: not
// asked yet, no to everything, or which of the three. Phones on a build before 33 don't say.
function pushes() {
  const KINDS = [['streak', 'Streak', 'var(--diff)'], ['fresh', 'New daily', 'var(--fun)'], ['news', 'Big news', 'var(--frus)']];
  const told = P.filter(p => typeof p.notify === 'string');
  if (!told.length) return `<p class="note">No tester's build reports this yet. It starts with build 33: once testers are on it, this shows what each one chose.</p>`;
  const asked = told.filter(p => p.notify !== '');
  const none = asked.filter(p => p.notify === 'none').length;
  const rows = KINDS.map(([k, label, col]) => {
    const n = asked.filter(p => p.notify.split(',').includes(k)).length;
    const pct = asked.length ? n / asked.length : 0;
    return `<div class="tier"><span class="nm" style="font-weight:600">${label}</span>
      <div class="track"><span class="fill" style="width:${pct * 100}%;background:${col}"></span></div>
      <span class="v"><b>${n}</b> of ${asked.length}</span></div>`;
  }).join('');
  const label = new Map(P.map((p, i) => [p.id, `Tester ${i + 1}`]));
  const names = { streak: 'streak', fresh: 'new daily', news: 'big news' };
  const each = P.map(p => {
    const v = typeof p.notify !== 'string' ? '<span class="nil">older build, not reported</span>'
      : p.notify === '' ? '<span class="nil">not asked yet</span>'
      : p.notify === 'none' ? '<span class="dd">said no to all of it</span>'
      : esc(p.notify.split(',').map(k => names[k] || k).join(', '));
    return `<li><b>${label.get(p.id)}</b>: ${v}</li>`;
  }).join('');
  return `<p class="note">Of the ${asked.length} tester${asked.length === 1 ? '' : 's'} who've been asked${none ? `, ${none} said no to everything` : ''}. ${told.length - asked.length ? `${told.length - asked.length} ${told.length - asked.length === 1 ? "hasn't" : "haven't"} been asked yet (it comes a few jobs after their first daily).` : ''}</p>
    ${asked.length ? `<div class="tiers">${rows}</div>` : ''}
    <ul class="surp">${each}</ul>
    <p class="note">This is what they ticked on the game's Notifications card: Streak ("Save my streak"), New daily ("New daily's here") and Big news. Whether iOS then allowed notifications isn't reported.</p>`;
}

// Rank correlation (Spearman, ties averaged): 1 means the same order, 0 unrelated.
function spearman(xs, ys) {
  const rank = v => { const o = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]); const r = []; for (let i = 0; i < o.length;) { let j = i; while (j + 1 < o.length && o[j + 1][0] === o[i][0]) j++; for (let k = i; k <= j; k++) r[o[k][1]] = (i + j) / 2; i = j + 1; } return r; };
  const a = rank(xs), b = rank(ys), ma = mean(a), mb = mean(b);
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; }
  return da && db ? num / Math.sqrt(da * db) : null;
}

// What the level engine planned (each job's tier, and its score: how many wrong plans its model player
// tries first) against what the testers rated, on the layouts that are in the game now.
function engineCheck() {
  if (!Object.keys(ENGINE).length) return '<p class="note">The engine numbers (engine.json) didn\'t load.</p>';
  const per = new Map();
  for (const r of latestRatings()) if (r.cur && r.d) { const a = per.get(r.n) || []; a.push(r.d); per.set(r.n, a); }
  const jobs = [...per.entries()].map(([n, d]) => ({ n, d: mean(d), k: d.length, e: ENGINE[n] }));
  if (!jobs.length) return '<p class="note">No ratings of the current layouts yet.</p>';
  const ORDER = ['tutorial', 'easy', 'medium', 'hard', 'melter', 'end'];
  const NAMES = { tutorial: 'Tutorial', easy: 'Easy', medium: 'Medium', hard: 'Hard', melter: 'Brain-melter', end: 'Endgame' };
  const tiers = ORDER.map(t => ({ t, js: jobs.filter(j => j.e.tier === t) })).filter(x => x.js.length);
  const bars = tiers.map(({ t, js }) => {
    const v = mean(js.map(j => j.d));
    return `<div class="tier"><span class="nm">${NAMES[t]}</span>
      <div class="track" title="${v.toFixed(1)} of 5">${[2, 3, 4].map(x => `<span class="tick" style="left:${(x - 1) / 4 * 100}%"></span>`).join('')}<span class="fill" style="width:${(v - 1) / 4 * 100}%"></span></div>
      <span class="v"><b>${v.toFixed(1)}</b> · ${js.length} job${js.length > 1 ? 's' : ''}</span></div>`;
  }).join('');
  const rho = jobs.length >= 5 ? spearman(jobs.map(j => j.e.ptries), jobs.map(j => j.d)) : null;
  const tierRank = jobs.map(j => ORDER.indexOf(j.e.tier));
  const rhoT = jobs.length >= 5 ? spearman(tierRank, jobs.map(j => j.d)) : null;
  const say = r => r == null ? 'too few jobs to tell' : r >= 0.7 ? 'closely' : r >= 0.45 ? 'fairly well' : r >= 0.2 ? 'only loosely' : 'hardly at all';
  const surprises = [];
  for (const j of jobs.sort((a, b) => a.n - b.n)) {
    const t = j.e.tier;
    if (['hard', 'melter', 'end'].includes(t) && j.d <= 2.5) surprises.push(`Job ${j.n} was planned <b>${NAMES[t].toLowerCase()}</b> but rated <b class="dd">${j.d.toFixed(1)}</b> (${j.k} rating${j.k > 1 ? 's' : ''}).`);
    if (['tutorial', 'easy'].includes(t) && j.d >= 3.5) surprises.push(`Job ${j.n} was planned <b>${NAMES[t].toLowerCase()}</b> but rated <b class="dd">${j.d.toFixed(1)}</b> (${j.k} rating${j.k > 1 ? 's' : ''}).`);
  }
  return `<p class="note">Average rated difficulty (1 to 5) of the jobs in each planned tier, counting only ratings of the layouts in the game now.</p>
    <div class="tiers">${bars}</div>
    <p class="verdict">The planned tiers match the players' order <b>${say(rhoT)}</b>${rhoT != null ? ` (rank match ${rhoT.toFixed(2)})` : ''}, and the engine's score matches it <b>${say(rho)}</b>${rho != null ? ` (${rho.toFixed(2)})` : ''}, over ${jobs.length} rated jobs. 1 would be the same order, 0 no relation.</p>
    ${surprises.length ? `<div><b>Surprises</b><ul class="surp">${surprises.map(s => `<li>${s}</li>`).join('')}</ul></div>` : '<p class="note">No job played far from its planned tier.</p>'}`;
}

function testerStats(p) {
  const rated = Object.entries(p.cells).filter(([, c]) => c.d || c.f || c.x).map(([n, c]) => ({ n: +n, ...c }));
  const later = rated.filter(c => c.n >= PAST);
  const vals = (list, k) => list.map(c => c[k]).filter(Boolean);
  const runs = Object.values(p.runs);
  const per = k => mean(runs.filter(r => k in r).map(r => r[k]));
  return { rated, later, vals, per, tz: tzName(p.tz) };
}

function peopleTable() {
  let h = `<thead><tr class="grp"><th></th><th></th><th></th><th></th><th class="sep" colspan="3">Ratings, all jobs (average / median)</th><th class="sep" colspan="3">Ratings, job ${PAST} on (average / median)</th><th class="sep" colspan="5">Per job played</th></tr>
    <tr><th>Tester</th><th>Furthest job</th><th>Sessions</th><th>Jobs rated</th>
    <th class="sep">Difficulty</th><th>Fun</th><th>Frustration</th>
    <th class="sep">Difficulty</th><th>Fun</th><th>Frustration</th>
    <th class="sep">Time</th><th>Hints</th><th>Calls</th><th>Undos</th><th>Restarts</th></tr></thead><tbody>`;
  P.forEach((p, i) => {
    const s = testerStats(p);
    h += `<tr><td><b>Tester ${i + 1}</b> <span class="muted">${esc(phoneName(p.phone))}${s.tz ? ' · ' + esc(s.tz) : ''}</span></td>
      <td>${p.furthest}</td><td>${p.sessions.size}</td><td>${s.rated.length}</td>
      <td class="sep dd">${am(s.vals(s.rated, 'd'))}</td><td class="ff">${am(s.vals(s.rated, 'f'))}</td><td class="xx">${am(s.vals(s.rated, 'x'))}</td>
      <td class="sep dd">${am(s.vals(s.later, 'd'))}</td><td class="ff">${am(s.vals(s.later, 'f'))}</td><td class="xx">${am(s.vals(s.later, 'x'))}</td>
      <td class="sep">${secs(s.per('secs'))}</td><td>${f1(s.per('hints'))}</td><td>${f1(s.per('calls'))}</td><td>${f1(s.per('undos'))}</td><td>${f1(s.per('restarts'))}</td></tr>`;
  });
  document.getElementById('people').innerHTML = h + '</tbody>';
}

// On a phone: a card per tester, folded to one line (how far, sessions); tap for the rest.
function peopleCards() {
  document.getElementById('cards').innerHTML = P.map((p, i) => {
    const s = testerStats(p);
    const row = (label, k) => `<span class="r">${label}</span><span class="${k === 'd' ? 'dd' : k === 'f' ? 'ff' : 'xx'}">${am(s.vals(s.rated, k))}</span><span class="${k === 'd' ? 'dd' : k === 'f' ? 'ff' : 'xx'}">${am(s.vals(s.later, k))}</span><span></span>`;
    return `<details class="card"><summary><b>Tester ${i + 1}</b><span class="chip">to job ${p.furthest}</span><span class="muted small">${p.sessions.size} session${p.sessions.size === 1 ? '' : 's'} · ${s.rated.length} rated · ${esc(phoneName(p.phone))}${s.tz ? ' · ' + esc(s.tz) : ''}</span></summary>
      <div class="cgrid"><span></span><span class="h">All jobs</span><span class="h">Job ${PAST} on</span><span></span>
        ${row('Difficulty', 'd')}${row('Fun', 'f')}${row('Frustration', 'x')}</div>
      <div class="help"><div>${secs(s.per('secs'))}<small>time</small></div><div>${f1(s.per('hints'))}<small>hints</small></div><div>${f1(s.per('calls'))}<small>calls</small></div><div>${f1(s.per('undos'))}<small>undos</small></div><div>${f1(s.per('restarts'))}<small>restarts</small></div></div>
    </details>`;
  }).join('');
}

function grid() {
  document.getElementById('key').innerHTML = [
    [rings(4, null, null, 40), 'Outer ring: difficulty', '1 easy, 5 very hard'],
    [rings(null, 4, null, 40), 'Middle ring: fun', '1 dull, 5 great'],
    [rings(null, null, 4, 40), 'Inner ring: frustration', '1 calm, 5 maddening'],
    [rings(1, 1, 1, 40) + rings(3, 3, 3, 40) + rings(5, 5, 5, 40), 'How far round', '1/5 is a fifth of the circle, 5/5 the whole thing'],
    [dot(true), 'Beaten, not rated', ''],
    [dot(false), 'Played, not beaten', ''],
  ].map(([s, a, b]) => `<div class="item">${s}<div><b>${a}</b>${b ? `<small>${b}</small>` : ''}</div></div>`).join('');
  if (!P.length) { document.getElementById('grid').innerHTML = '<tbody><tr><td class="muted" style="padding:20px">No tester records yet.</td></tr></tbody>'; return; }
  const maxJob = Math.max(...P.map(p => p.furthest), ...P.flatMap(p => Object.keys(p.cells).map(Number)));
  let h = '<thead><tr><th><span class="ph">Job</span></th>';
  P.forEach((p, i) => {
    const tz = tzName(p.tz);
    h += `<th><div class="ph">T${i + 1}</div><div class="meta">${esc(phoneName(p.phone))}${tz ? ' · ' + esc(tz) : ''}<br>build ${esc(buildOf(p.build))} · ${p.n_rated} rated<br>last ${esc(fmtTime(p.last))}</div><span class="far">${p.furthest}</span></th>`;
  });
  h += '<th class="all"><div class="ph">Avg</div></th></tr></thead><tbody>';
  for (let n = 1; n <= maxJob; n++) {
    h += `<tr class="${n > 1 && (n - 1) % 10 === 0 ? 'zone' : ''}"><th data-job="${n}"><span class="jn">${n}</span></th>`;
    const rated = [];
    P.forEach((p, i) => {
      const c = p.cells[n];
      const reached = n <= p.furthest || (c && c.played);
      let inner = '';
      if (c && (c.d || c.f || c.x)) { inner = rings(c.d, c.f, c.x); rated.push(c); }
      else if (c) inner = dot(c.won);
      h += `<td class="${reached ? 'r' : ''}" data-p="${i}" data-n="${n}">${inner}</td>`;
    });
    const avg = k => mean(rated.map(c => c[k]).filter(Boolean));
    h += `<td class="all" data-avg="${n}" data-c="${rated.length}" data-d="${avg('d') ?? ''}" data-f="${avg('f') ?? ''}" data-x="${avg('x') ?? ''}">${rated.length ? rings(avg('d'), avg('f'), avg('x')) : ''}</td></tr>`;
  }
  const g = document.getElementById('grid');
  g.innerHTML = h + '</tbody>';
  g.addEventListener('pointermove', e => { const td = e.target.closest('td, th[data-job]'); td ? show(e, td) : hide(); });
  g.addEventListener('pointerleave', hide);
  document.querySelector('.scroller').addEventListener('scroll', hide);
}

// Tooltip
const tip = document.getElementById('tip');
const sc = v => v ? (Math.round(v * 10) / 10) : '–';
function show(e, td) {
  let html = '';
  if (td.dataset.job) {
    html = `<b>Job ${esc(td.dataset.job)}</b><br>Latest title rated: “${esc(T[td.dataset.job] || 'not rated yet')}”`;
  } else if (td.dataset.avg) {
    if (!+td.dataset.c) return hide();
    html = `<b>Job ${esc(td.dataset.avg)}: average</b><br>${+td.dataset.c} rating${+td.dataset.c > 1 ? 's' : ''}<br>Difficulty ${sc(+td.dataset.d)} · Fun ${sc(+td.dataset.f)} · Frustration ${sc(+td.dataset.x)}`;
  } else {
    const p = P[+td.dataset.p], n = +td.dataset.n, c = p && p.cells[n];
    if (!p) return hide();
    html = `<b>Tester ${+td.dataset.p + 1}, job ${n}</b><br>`;
    if (!c) html += n <= p.furthest ? 'Beaten (before play records began)' : 'Not reached yet';
    else {
      html += `${c.title ? '“' + esc(c.title) + '”' : ''}${c.v ? ' · build ' + esc(buildOf(c.v)) : ''}<br>`;
      html += c.d || c.f || c.x ? `Difficulty ${sc(c.d)} · Fun ${sc(c.f)} · Frustration ${sc(c.x)}` : (c.won ? 'Beaten, not rated' : 'Played, not beaten');
      if (c.tags && c.tags.length) html += `<br>Tags: ${esc(c.tags.join(', ').replace(/_/g, ' '))}`;
      if (c.note) html += `<br>“${esc(c.note)}”`;
    }
  }
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hide() { tip.hidden = true; }

load();
</script>
</body>
</html>
